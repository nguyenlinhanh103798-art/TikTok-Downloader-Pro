
name: Build TikTok Downloader Pro

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4

      - name: Cai Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cai thu vien
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Tao file EXE
        run: |
          pyinstaller --noconfirm --clean --windowed --name TikTokDownloaderPro --collect-all gallery_dl --collect-all requests --collect-all pyperclip gui.py

      - name: Dong goi tep
        uses: actions/upload-artifact@v4
        with:
          name: TikTokDownloaderPro-Windows
          path: dist/TikTokDownloaderPro/
